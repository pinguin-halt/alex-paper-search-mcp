[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "openalex-mcp-server"
version = "1.0.0"
authors = [
    { name = "OpenAlex MCP Server Contributors" },
]
description = "A Model Context Protocol (MCP) server for searching academic papers using OpenAlex"
readme = "README.md"
requires-python = ">=3.10"
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Information Analysis",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
keywords = ["openalex", "academic", "papers", "research", "mcp", "model-context-protocol"]

dependencies = [
    "pyalex>=0.13",
    "fastmcp>=3.4.2",
    "mcp>=1.27.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
    "black>=23.0.0",
    "isort>=5.12.0",
    "mypy>=1.0.0",
]

[project.urls]
Homepage = "https://github.com/yourusername/openalex-mcp-server"
Repository = "https://github.com/yourusername/openalex-mcp-server"
Issues = "https://github.com/yourusername/openalex-mcp-server/issues"

[project.scripts]
openalex-mcp-server = "openalex_mcp.server:main"

[tool.hatch.build.targets.wheel]
packages = ["openalex_mcp"]

[tool.black]
line-length = 100
target-version = ['py310']
include = '\.pyi?$'

[tool.isort]
profile = "black"
line_length = 100
multi_line_output = 3
include_trailing_comma = true
force_grid_wrap = 0
use_parentheses = true
ensure_newline_before_comments = true

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
no_implicit_optional = true
strict_optional = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
asyncio_mode = "auto"